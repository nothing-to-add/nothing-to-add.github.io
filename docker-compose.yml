services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_BUILDKIT: "0"
    image: portfolio:latest
    container_name: portfolio-website
    ports:
      - "3000:80"  # Access at http://localhost:3000
    networks:
      - portfolio-network
    labels:
      - "project=portfolio"
      - "jenkins.managed=true"
      - "environment=development"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Optional: Add a reverse proxy for production-like setup
  # nginx-proxy:
  #   image: nginx:alpine
  #   container_name: portfolio-proxy
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
  #   depends_on:
  #     - portfolio
  #   networks:
  #     - portfolio-network

networks:
  portfolio-network:
    name: portfolio-dev-network
    driver: bridge

